name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Set AssemblyVersion from tag
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        if ($tag -notmatch '^v(?<version>[0-9]+(\.[0-9]+)*)$') { throw "Unexpected tag name: $tag (expected v<version>, e.g. v0.291)" }
        $version = $Matches['version']
        $csprojPath = "app/GHelper.csproj"
        $content = Get-Content $csprojPath -Raw
        if ($content -notmatch '<AssemblyVersion>[^<]*</AssemblyVersion>') { throw "AssemblyVersion element not found in $csprojPath" }
        $content = $content -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$version</AssemblyVersion>"
        Set-Content -Path $csprojPath -Value $content -Encoding utf8BOM -NoNewline
        Write-Host "AssemblyVersion set to $version (from tag $tag)"

    - name: Publish
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

    - name: Package GHelper.exe
      shell: pwsh
      run: |
        $publish = "app/bin/x64/Release/net10.0-windows/win-x64/publish"
        Copy-Item "$publish/GHelper.exe" -Destination "./GHelper.exe" -Force
        Compress-Archive -Path "$publish/GHelper.exe" -DestinationPath "./GHelper.zip" -Force

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: GHelper
        path: |
          ./GHelper.exe
          ./GHelper.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$env:GITHUB_REF_NAME" ./GHelper.exe ./GHelper.zip --title "$env:GITHUB_REF_NAME" --generate-notes
